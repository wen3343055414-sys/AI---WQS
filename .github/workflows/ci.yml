name: 验收工作台
on:
  pull_request:
  push:
    branches: [main, "feat/**", "codex/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify public source contains no runtime state
        run: node scripts/check-source.mjs
      - name: Verify local updater rules
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify native admin controls
        run: python3 -m unittest discover -s admin/tests -p 'test_*.py'
      - name: Check installer syntax
        run: bash -n scripts/install-local-server.sh scripts/start-linux.sh
      - run: npm run build
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_windows_*.py' -v
      - run: python -m unittest discover -s admin/tests -p 'test_*.py' -v
      - run: npm run build
  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the workbench
        run: docker compose up --build --detach --wait --wait-timeout 90
      - name: Check container HTTP behavior
        run: node scripts/check-container.mjs
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the test container
        if: always()
        run: docker compose down --volumes

  auth-ui:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Chinese fonts for browser previews
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
      - name: Install isolated browser test tooling
        id: playwright
        run: npm install --prefix "$RUNNER_TEMP/auth-ui" --no-package-lock --no-save playwright@1.56.1
      - name: Verify authentication screens and flows
        run: PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/auth-ui/node_modules/playwright/index.mjs" node scripts/auth-ui-check.mjs
      - name: Verify real MCP connections and conversation tools
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        run: PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/auth-ui/node_modules/playwright/index.mjs" node scripts/plugins-ui-check.mjs
      - name: Verify management pages and responsive navigation
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        run: PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/auth-ui/node_modules/playwright/index.mjs" node scripts/admin-ui-check.mjs
      - name: Capture representative screens for review
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, existsSync } from 'node:fs';
          for (const name of ['navigation-home-desktop', 'login-account-desktop', 'features-plugins-desktop', 'settings-account-desktop', 'admin-overview-desktop', 'admin-models-desktop', 'admin-access-desktop', 'admin-overview-mobile-320', 'plugins-center-desktop']) {
            const file = 'artifacts/auth/' + name + '.png';
            if (existsSync(file)) console.log('UI_PREVIEW:' + name + ':' + readFileSync(file).toString('base64'));
          }
          JS
      - name: Save login previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authentication-previews
          path: artifacts/auth/
          if-no-files-found: ignore
          retention-days: 7
